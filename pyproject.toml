[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ore-xccy-curve-cpp"
version = "1.1.0"
description = "C++ XCCY Curve Builder with full CrossCcyBasisMtMResetSwapHelper parameter support"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/yourusername/ore-xccy-curve-cpp"

[tool.scikit-build]
# Build type
cmake.build-type = "Release"

# Minimum CMake version
cmake.minimum-version = "3.15"

# Wheel settings - include the Python package
wheel.packages = ["ore_xccy_curve_cpp"]
wheel.install-dir = "."

# Pass environment variables to CMake
cmake.define = {}

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
